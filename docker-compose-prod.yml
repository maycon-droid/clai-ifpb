name: clai-prod

services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    image: clai-backend:0.0.1-prod
    container_name: clai_backend_prod
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - clai-net

  mongodb:
    image: mongo:9.0.2
    container_name: clai_mongodb_prod
    restart: always
    environment:
      - MONGO_INITDB_DATABASE=clai_db_prod
    volumes:
      - mongo_prod_data:/data/db
    networks:
      - clai-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mongo_prod_data:
    name: projeto-clai_mongo_prod_data

networks:
  clai-net:
    driver: bridge
