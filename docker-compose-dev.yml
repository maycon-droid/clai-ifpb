name: clai-dev

services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    image: clai-backend:0.0.1-dev
    container_name: clai_backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8081}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
    volumes:
      - ./apps/backend/src/main/resources/static:/app/static:ro
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:9.0.2
    container_name: clai_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: clai_db
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
    name: projeto-clai_mongo_data
