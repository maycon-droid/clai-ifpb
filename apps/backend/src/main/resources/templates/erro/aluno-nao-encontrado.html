
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aluno não encontrado</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #334155;
            margin: 0;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .erro-card {
            background: #ffffff;
            width: 100%;
            max-width: 560px;
            padding: 32px;
            border: 1px solid #e5eaf0;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.04);
        }

        .erro-icone {
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff1f2;
            color: #be123c;
            border-radius: 10px;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #1e293b;
            margin: 0 0 20px;
            line-height: 1.3;
        }

        .erro-mensagem {
            background: #f8fafc;
            border-left: 3px solid #ef4444;
            border-radius: 5px;
            padding: 15px;
            color: #475569;
            font-size: 14px;
            line-height: 1.6;
            overflow-wrap: anywhere;
            margin-bottom: 26px;
        }

        .botao-voltar {
            display: inline-block;
            padding: 11px 18px;
            background: #2563eb;
            color: #ffffff;
            border-radius: 7px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .botao-voltar:hover {
            background: #1d4ed8;
        }

        @media (max-width: 600px) {
            .erro-card {
                padding: 24px;
            }

            h1 {
                font-size: 21px;
            }

            .botao-voltar {
                text-align: center;
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <main class="erro-card">
        <div class="erro-icone" aria-hidden="true">!</div>

        <h1>Aluno não encontrado</h1>

        <p class="erro-mensagem" th:text="${mensagemErro}">
            Não foi possível encontrar o aluno solicitado.
        </p>

        <a class="botao-voltar" th:href="@{/alunos}">
            Voltar à lista de alunos
        </a>
    </main>
</body>

</html>
