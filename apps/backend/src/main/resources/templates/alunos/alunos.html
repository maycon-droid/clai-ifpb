<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alunos</title>
    <link
      rel="stylesheet"
      href="../../static/css/alunos.css"
      th:href="@{/css/alunos.css}"
    />
  </head>

  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>CLAI</h2>
          <button
            type="button"
            class="sidebar-toggle"
            aria-label="Recolher menu"
          >
            ☰
          </button>
        </div>
        <nav>
          <a href="#">Início</a>
          <a href="#">Alunos</a>
          <a href="#">Estudos de caso</a>
        </nav>
      </aside>
      <main class="container">
        <section class="page-header">
          <h1>Alunos cadastrados</h1>
          <p>Gerencie e consulte os alunos registrados no sistema.</p>
        </section>

        <section class="resumo">
          <p>Total de alunos</p>
          <strong>24</strong>
        </section>

        <section class="listagem">
          <div class="listagem-toolbar">
            <div class="busca">
              <input
                type="text"
                id="busca"
                placeholder="Buscar aluno pelo nome ou matrícula"
              />
            </div>
            <a th:href="@{/alunos/novo}"> Cadastrar aluno </a>
          </div>
          <ul class="alunos-lista">
            <li class="aluno-item">
              <div class="aluno-info">
                <h4>Maria Eduarda Silva</h4>
                <p>Matrícula: 202610023</p>
              </div>
              <div class="aluno-acoes">
                <button type="button">Visualizar</button>
                <a href="#"> Editar </a>
              </div>
            </li>
          </ul>

          <table>
            <thead>
              <tr>
                <th>Nome</th>
                <th>Matrícula</th>
                <th>E-mail</th>
                <th>Tipo</th>
                <th>Ações</th>
              </tr>
            </thead>

            <tbody id="tabela-alunos">
              <tr th:each="aluno : ${alunos}">
                <td th:text="${aluno.nome}">Nome do aluno</td>
                <td
                  th:text="${aluno.matricula != null
                        ? aluno.matricula.numeroMatricula
                        : '-'}"
                >
                  Matrícula
                </td>

                <td th:text="${aluno.email}">E-mail</td>

                <td th:text="${aluno.tipoAluno}">Tipo</td>

                <td>
                  <button type="button">Visualizar</button>

                  <a th:href="@{/alunos/{id}/editar(id=${aluno.id})}">
                    Editar
                  </a>

                  <form
                    th:action="@{/alunos/{id}/excluir(id=${aluno.id})}"
                    method="post"
                    style="display: inline"
                    onsubmit="
                      return confirm(
                        'Tem certeza que deseja excluir este aluno? Esta ação não poderá ser desfeita.',
                      );
                    "
                  >
                    <button type="submit" class="botao-excluir">Excluir</button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </section>
      </main>
    </div>
    <script>
      const campoBusca = document.getElementById("busca");
      const tabelaAlunos = document.getElementById("tabela-alunos");

      campoBusca.addEventListener("input", function () {
        const termo = campoBusca.value.toLowerCase();

        const linhas = tabelaAlunos.querySelectorAll("tr");

        linhas.forEach(function (linha) {
          const nome = linha.children[0].textContent.toLowerCase();
          const matricula = linha.children[1].textContent.toLowerCase();

          const encontrou = nome.includes(termo) || matricula.includes(termo);

          linha.style.display = encontrou ? "" : "none";
        });
      });
    </script>
  </body>
</html>
