<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alunos</title>
    <link
      rel="stylesheet"
      href="../../static/css/alunos.css"
      th:href="@{/css/alunos.css}"
    />
  </head>

  <body>
    <div class="app-layout">
      <div th:replace="~{fragments/sidebar :: sidebar}"></div>
      <main class="container">
        <section class="page-header">
          <h1>Alunos cadastrados</h1>
          <p>Gerencie e consulte os alunos registrados no sistema.</p>
        </section>

        <section class="resumo">
          <p>Total de alunos</p>
          <strong th:text="${#lists.size(alunos)}">24</strong>
        </section>

        <section class="listagem">
          <div class="listagem-toolbar">
            <div class="busca">
              <input
                type="text"
                id="busca"
                placeholder="Buscar aluno pelo nome ou matrícula"
              />
            </div>
            <a th:href="@{/alunos/novo}" id="cadastrar-aluno-btn">
              Cadastrar aluno
            </a>
          </div>
          <ul class="alunos-lista">
            <li class="aluno-item" th:each="aluno : ${alunos}">
              <div class="aluno-info">
                <h4 th:text="${aluno.nome}">Maria</h4>
                <p>
                  Matrícula:
                  <span
                    th:text="${aluno.matricula != null ? aluno.matricula.numeroMatricula : '-'}"
                    >202610023</span
                  >
                </p>
              </div>
              <div class="aluno-acoes">
                <button type="button">Visualizar</button>
                <a th:href="@{/alunos/{id}/editar(id=${aluno.id})}"> Editar </a>
              </div>
            </li>
          </ul>
        </section>
      </main>
    </div>
    <script th:src="@{/js/alunos.js}" defer></script>
  </body>
</html>
