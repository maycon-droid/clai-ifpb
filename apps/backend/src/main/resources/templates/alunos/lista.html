
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alunos</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #334155;
            margin: 0;
            padding: 30px 40px;
        }

        h1 {
            font-size: 26px;
            color: #1e293b;
            margin: 0 0 22px;
        }

        /* Cadastrar aluno */
        body > a {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 11px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 22px;
        }

        body > a:hover {
            background: #1d4ed8;
        }

        /* Busca */
        .busca {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .busca label {
            font-size: 14px;
            font-weight: 600;
        }

        .busca input {
            width: 320px;
            max-width: 100%;
            padding: 11px 13px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            background: white;
        }

        .busca input:focus {
            outline: none;
            border-color: #2563eb;
        }

        /* Tabela */
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border: 1px solid #e2e8f0;
        }

        th {
            background: #f1f5f9;
            color: #475569;
            text-align: left;
            padding: 15px;
            font-size: 14px;
            font-weight: 600;
            border-bottom: 1px solid #e2e8f0;
        }

        td {
            padding: 15px;
            font-size: 14px;
            border-bottom: 1px solid #e2e8f0;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        /* Manter as três ações na mesma linha */
        th:last-child,
        td:last-child {
            white-space: nowrap;
        }

        td:last-child button,
        td:last-child a {
            display: inline-block;
            font-family: inherit;
            font-size: 13px;
            padding: 8px 12px;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
            margin-right: 5px;
        }

        /* Visualizar */
        td:last-child > button:first-of-type {
            background: #f1f5f9;
            color: #334155;
            border: 1px solid #cbd5e1;
        }

        /* Editar */
        td:last-child a {
            background: #eff6ff;
            color: #2563eb;
            border: 1px solid #bfdbfe;
        }

        /* Excluir */
        td:last-child .botao-excluir {
            background: #fff1f2;
            color: #be123c;
            border: 1px solid #fecdd3;
        }

        td:last-child button:hover,
        td:last-child a:hover {
            filter: brightness(0.96);
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 15px;
                overflow-x: auto;
            }

            .busca {
                flex-wrap: wrap;
            }

            .busca input {
                width: 100%;
            }

            table {
                min-width: 760px;
            }
        }
    </style>
</head>

<body>

    <h1>Alunos matriculados</h1>

    <a th:href="@{/alunos/novo}">
        Cadastrar novo aluno
    </a>

    <div class="busca">
        <label for="busca">Buscar aluno:</label>

        <input
            type="text"
            id="busca"
            placeholder="Digite o nome ou a matrícula"
        >
    </div>

    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Matrícula</th>
                <th>E-mail</th>
                <th>Tipo</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody id="tabela-alunos">
            <tr th:each="aluno : ${alunos}">
                <td th:text="${aluno.nome}">Nome do aluno</td>

                <td th:text="${aluno.matricula != null
                    ? aluno.matricula.numeroMatricula
                    : '-'}">
                    Matrícula
                </td>

                <td th:text="${aluno.email}">
                    E-mail
                </td>

                <td th:text="${aluno.tipoAluno}">
                    Tipo
                </td>

                <td>
                    <button type="button">Visualizar</button>

                    <a th:href="@{/alunos/{id}/editar(id=${aluno.id})}">
                        Editar
                    </a>

                <form
                    th:action="@{/alunos/{id}/excluir(id=${aluno.id})}"
                    method="post"
                    style="display: inline;"
                    onsubmit="return confirm('Tem certeza que deseja excluir este aluno? Esta ação não poderá ser desfeita.');"
                >
                    <button type="submit" class="botao-excluir">
                        Excluir
                    </button>
                </form>
                </td>
            </tr>
        </tbody>
    </table>

    <script>
        const campoBusca = document.getElementById("busca");
        const tabelaAlunos = document.getElementById("tabela-alunos");

        campoBusca.addEventListener("input", function () {
            const termo = campoBusca.value.toLowerCase();

            const linhas = tabelaAlunos.querySelectorAll("tr");

            linhas.forEach(function (linha) {
                const nome = linha.children[0].textContent.toLowerCase();
                const matricula = linha.children[1].textContent.toLowerCase();

                const encontrou =
                    nome.includes(termo) ||
                    matricula.includes(termo);

                linha.style.display = encontrou ? "" : "none";
            });
        });
    </script>

</body>
</html>
