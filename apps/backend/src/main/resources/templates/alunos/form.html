<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Aluno</title>
</head>

<body>

    <h1 th:text="${aluno.id == null ? 'Cadastrar aluno' : 'Editar aluno'}">
        Cadastrar aluno
    </h1>

    <form
        th:object="${aluno}"
        th:action="${aluno.id == null}
            ? @{/alunos}
            : @{/alunos/{id}/editar(id=${aluno.id})}"
        method="post"
    >

        <input type="hidden" th:field="*{id}">

        <div>
            <label for="nome">Nome:</label>
            <input
                type="text"
                id="nome"
                th:field="*{nome}"
                required
            >
        </div>

        <div>
            <label for="cpf">CPF:</label>
            <input
                type="text"
                id="cpf"
                th:field="*{cpf}"
                required
            >
        </div>

        <div>
            <label for="email">E-mail:</label>
            <input
                type="email"
                id="email"
                th:field="*{email}"
            >
        </div>

        <div>
            <label for="matricula">Matrícula:</label>
            <input
                type="text"
                id="matricula"
                name="matricula.numeroMatricula"
                th:value="${aluno.matricula != null ? aluno.matricula.numeroMatricula : ''}"
                required
            >
        </div>

        <div>
            <label for="periodoIngresso">Período de ingresso:</label>
            <input
                type="text"
                 id="periodoIngresso"
                name="matricula.periodoIngresso"
                th:value="${aluno.matricula != null ? aluno.matricula.periodoIngresso : ''}"
                placeholder="Ex.: 2026.1"
                required
            >
        </div>

        <div>
            <label for="tipoAluno">Tipo do aluno:</label>
            <input
                type="text"
                id="tipoAluno"
                th:field="*{tipoAluno}"
                required
            >
        </div>

        <button type="submit">
            Salvar
        </button>

        <a th:href="@{/alunos}">
            Cancelar
        </a>

    </form>

</body>
</html>
