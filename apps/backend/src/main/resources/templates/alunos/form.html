<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Aluno</title>

    <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 40px;
    }

    .container {
        max-width: 600px;
        margin: 0 auto;
        background-color: #ffffff;
        padding: 30px;
        border-radius: 8px;
    }

    h1 {
        margin-top: 0;
        margin-bottom: 25px;
    }

    .campo {
        display: flex;
        flex-direction: column;
        margin-bottom: 16px;
    }

    .campo label {
        margin-bottom: 6px;
        font-weight: bold;
    }

    .campo input {
        padding: 10px;
        border: 1px solid #cccccc;
        border-radius: 4px;
        font-size: 14px;
    }

    .acoes {
        display: flex;
        gap: 10px;
        margin-top: 24px;
    }

    button {
        padding: 10px 18px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    .cancelar {
        display: inline-block;
        padding: 10px 18px;
        text-decoration: none;
        border: 1px solid #cccccc;
        border-radius: 4px;
        color: #333333;
    }
</style>

</head>

<body>
    <div class="container">
        <h1 th:text="${aluno.id == null ? 'Cadastrar aluno' : 'Editar aluno'}">
            Cadastrar aluno
        </h1>

        <form
            th:object="${aluno}"
            th:action="${aluno.id == null}
                ? @{/alunos}
                : @{/alunos/{id}/editar(id=${aluno.id})}"
            method="post"
        >

            <input type="hidden" th:field="*{id}">

            <div class="campo">
                <label for="nome">Nome:</label>
                <input
                    type="text"
                    id="nome"
                    th:field="*{nome}"
                    required
                >
            </div>

            <div class="campo">
                <label for="cpf">CPF:</label>
                <input
                    type="text"
                    id="cpf"
                    th:field="*{cpf}"
                    required
                >
            </div>

            <div class="campo">
                <label for="email">E-mail:</label>
                <input
                    type="email"
                    id="email"
                    th:field="*{email}"
                >
            </div>

            <div class="campo">
                <label for="matricula">Matrícula:</label>
                <input
                    type="text"
                    id="matricula"
                    name="matricula.numeroMatricula"
                    th:value="${aluno.matricula != null ? aluno.matricula.numeroMatricula : ''}"
                    required
                >
            </div>

            <div class="campo">
                <label for="periodoIngresso">Período de ingresso:</label>
                <input
                    type="text"
                    id="periodoIngresso"
                    name="matricula.periodoIngresso"
                    th:value="${aluno.matricula != null ? aluno.matricula.periodoIngresso : ''}"
                    placeholder="Ex.: 2026.1"
                    required
                >
            </div>

            <div class="campo">
                <label for="tipoAluno">Tipo do aluno:</label>
                <input
                    type="text"
                    id="tipoAluno"
                    th:field="*{tipoAluno}"
                    required
                >
            </div>
            <div class="acoes">
                <button type="submit">
                    Salvar
                </button>

                <a th:href="@{/alunos}">
                    Cancelar
                </a>
            </div>

        </form>
    </div>
</body>
</html>
