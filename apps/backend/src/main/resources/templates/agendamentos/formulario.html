<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agendamento | CLAI</title>
    <link rel="stylesheet" th:href="@{/css/global.css}" />
    <link rel="stylesheet" th:href="@{/css/sidebar.css}" />
    <link rel="stylesheet" th:href="@{/css/relatorios-atendimento.css}" />
    <link rel="stylesheet" th:href="@{/css/atendimentos.css}" />
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="container">
        <section class="page-header">
            <h1 th:text="${agendamento.id == null ? 'Novo agendamento' : 'Editar agendamento'}">
                Novo agendamento
            </h1>
            <p>Preencha os dados para organizar o atendimento.</p>
        </section>

        <form class="relatorio-formulario"
              th:object="${agendamento}"
              th:action="${agendamento.id == null} ? @{/agendamentos/salvar} : @{/agendamentos/{id}/editar(id=${agendamento.id})}"
              method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <section class="relatorio-form-secao">
                <h2>Identificação</h2>

                <div class="relatorio-form-campo">
                    <label for="alunoId">Aluno *</label>
                    <select id="alunoId" th:field="*{alunoId}" required>
                        <option value="">Selecione um aluno</option>
                        <option th:each="aluno : ${alunos}"
                                th:value="${aluno.id}"
                                th:text="${aluno.nome}">
                        </option>
                    </select>
                    <small class="relatorio-form-erro"
                           th:if="${#fields.hasErrors('alunoId')}"
                           th:errors="*{alunoId}"></small>
                </div>

                <div class="relatorio-form-grade">
                    <div class="relatorio-form-campo">
                        <label for="profissionalResponsavel">Profissional responsável *</label>
                        <input type="text"
                               id="profissionalResponsavel"
                               th:field="*{profissionalResponsavel}"
                               maxlength="255"
                               placeholder="Nome do profissional"
                               required />
                        <small class="relatorio-form-erro"
                               th:if="${#fields.hasErrors('profissionalResponsavel')}"
                               th:errors="*{profissionalResponsavel}"></small>
                    </div>

                    <div class="relatorio-form-campo">
                        <label for="modalidade">Modalidade *</label>
                        <select id="modalidade" th:field="*{modalidade}" required>
                            <option value="">Selecione</option>
                            <option value="Presencial">Presencial</option>
                            <option value="Remoto">Remoto</option>
                        </select>
                        <small class="relatorio-form-erro"
                               th:if="${#fields.hasErrors('modalidade')}"
                               th:errors="*{modalidade}"></small>
                    </div>
                </div>
            </section>

            <section class="relatorio-form-secao">
                <h2>Data e horário</h2>

                <div class="relatorio-form-grade">
                    <div class="relatorio-form-campo">
                        <label for="data">Data *</label>
                        <input type="date" id="data" th:field="*{data}" required />
                        <small class="relatorio-form-erro"
                               th:if="${#fields.hasErrors('data')}"
                               th:errors="*{data}"></small>
                    </div>

                    <div class="relatorio-form-campo">
                        <label for="horaInicio">Horário inicial *</label>
                        <input type="time" id="horaInicio" th:field="*{horaInicio}" required />
                        <small class="relatorio-form-erro"
                               th:if="${#fields.hasErrors('horaInicio')}"
                               th:errors="*{horaInicio}"></small>
                    </div>

                    <div class="relatorio-form-campo">
                        <label for="horaFim">Horário final *</label>
                        <input type="time" id="horaFim" th:field="*{horaFim}" required />
                        <small class="relatorio-form-erro"
                               th:if="${#fields.hasErrors('horaFim')}"
                               th:errors="*{horaFim}"></small>
                    </div>
                </div>
            </section>

            <section class="relatorio-form-secao">
                <h2>Personalização</h2>

                <div class="relatorio-form-grade">
                    <div class="relatorio-form-campo">
                        <label for="cor">Cor do agendamento *</label>
                        <input type="color" id="cor" th:field="*{cor}" required />
                        <small class="relatorio-form-erro"
                               th:if="${#fields.hasErrors('cor')}"
                               th:errors="*{cor}"></small>
                    </div>
                </div>

                <div class="relatorio-form-campo">
                    <label for="observacoes">Observações</label>
                    <textarea id="observacoes"
                              th:field="*{observacoes}"
                              rows="3"
                              maxlength="2000"
                              placeholder="Informações adicionais sobre o agendamento"></textarea>
                    <small class="relatorio-form-erro"
                           th:if="${#fields.hasErrors('observacoes')}"
                           th:errors="*{observacoes}"></small>
                </div>
            </section>

            <div class="relatorio-form-acoes">
                <button type="submit" class="relatorios-btn-cadastrar">
                    Salvar agendamento
                </button>
                <a th:href="@{/atendimentos}" class="relatorio-btn-voltar">
                    Cancelar
                </a>
            </div>
        </form>
    </main>
</div>
</body>
</html>
