<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finalizar Atendimento | CLAI</title>
    <link rel="stylesheet" th:href="@{/css/global.css}" />
    <link rel="stylesheet" th:href="@{/css/sidebar.css}" />
    <link rel="stylesheet" th:href="@{/css/relatorios-atendimento.css}" />
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="container">
        <section class="page-header">
            <h1>Finalizar atendimento</h1>
            <p>Registre o relatório obrigatório para concluir este atendimento.</p>
        </section>

        <form class="relatorio-formulario"
              th:object="${relatorio}"
              th:action="@{/agendamentos/{id}/finalizar(id=${agendamento.id})}"
              method="post">

            <div th:if="${mensagemErro != null}"
                 class="relatorio-form-erro"
                 role="alert"
                 th:text="${mensagemErro}">
            </div>

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <input type="hidden" th:field="*{alunoId}" />

            <section class="relatorio-form-secao">
                <h2>Dados do agendamento</h2>

                <div class="relatorio-form-grade">
                    <div class="relatorio-form-campo">
                        <label>Aluno</label>
                        <input type="text"
                               th:value="${aluno != null ? aluno.nome : 'Aluno vinculado'}"
                               readonly />
                    </div>

                    <input type="hidden" th:field="*{dataAtendimento}" />

                    <div class="relatorio-form-campo">
                        <label>Data do atendimento</label>
                        <input type="date" th:value="${relatorio.dataAtendimento}" readonly />
                    </div>

                    <div class="relatorio-form-campo">
                        <label>Profissional responsável</label>
                        <input type="text" th:field="*{profissionalResponsavel}" readonly />
                    </div>

                    <div class="relatorio-form-campo">
                        <label>Modalidade</label>
                        <input type="text" th:field="*{modalidade}" readonly />
                    </div>
                </div>
            </section>

            <section class="relatorio-form-secao">
                <h2>Registro do atendimento</h2>

                <div class="relatorio-form-campo">
                    <label for="titulo">Título do relatório *</label>
                    <input type="text"
                           id="titulo"
                           th:field="*{titulo}"
                           placeholder="Informe o título"
                           required />
                    <small class="relatorio-form-erro"
                           th:if="${#fields.hasErrors('titulo')}"
                           th:errors="*{titulo}"></small>
                </div>

                <div class="relatorio-form-campo">
                    <label for="tipoAtendimento">Tipo de atendimento *</label>
                    <input type="text"
                           id="tipoAtendimento"
                           th:field="*{tipoAtendimento}"
                           placeholder="Ex.: Individual ou em grupo"
                           required />
                    <small class="relatorio-form-erro"
                           th:if="${#fields.hasErrors('tipoAtendimento')}"
                           th:errors="*{tipoAtendimento}"></small>
                </div>

                <div class="relatorio-form-campo">
                    <label for="objetivo">Objetivo</label>
                    <textarea id="objetivo"
                              th:field="*{objetivo}"
                              rows="3"></textarea>
                </div>

                <div class="relatorio-form-campo">
                    <label for="atividadesRealizadas">Atividades realizadas *</label>
                    <textarea id="atividadesRealizadas"
                              th:field="*{atividadesRealizadas}"
                              rows="5"
                              placeholder="Descreva as atividades realizadas"
                              required></textarea>
                    <small class="relatorio-form-erro"
                           th:if="${#fields.hasErrors('atividadesRealizadas')}"
                           th:errors="*{atividadesRealizadas}"></small>
                </div>
            </section>

            <section class="relatorio-form-secao">
                <h2>Informações complementares</h2>

                <div class="relatorio-form-campo">
                    <label for="observacoes">Observações</label>
                    <textarea id="observacoes"
                              th:field="*{observacoes}"
                              rows="3"></textarea>
                </div>

                <div class="relatorio-form-campo">
                    <label for="encaminhamentos">Encaminhamentos</label>
                    <textarea id="encaminhamentos"
                              th:field="*{encaminhamentos}"
                              rows="3"></textarea>
                </div>
            </section>

            <section class="relatorio-form-secao">
                <h2>Acompanhamento</h2>

                <div class="relatorio-form-grade">
                    <div class="relatorio-form-campo">
                        <label for="necessitaAcompanhamento">
                            Necessita de acompanhamento? *
                        </label>
                        <select id="necessitaAcompanhamento"
                                th:field="*{necessitaAcompanhamento}"
                                required>
                            <option value="">Selecione</option>
                            <option th:value="true">Sim</option>
                            <option th:value="false">Não</option>
                        </select>
                        <small class="relatorio-form-erro"
                               th:if="${#fields.hasErrors('necessitaAcompanhamento')}"
                               th:errors="*{necessitaAcompanhamento}"></small>
                    </div>

                    <div class="relatorio-form-campo">
                        <label for="dataProximoAcompanhamento">
                            Data do próximo acompanhamento
                        </label>
                        <input type="date"
                               id="dataProximoAcompanhamento"
                               th:field="*{dataProximoAcompanhamento}" />
                    </div>
                </div>
            </section>

            <section class="relatorio-form-secao">
                <h2>Agendar próximo atendimento</h2>

                <div class="relatorio-form-campo">
                    <label>
                        <input type="checkbox" id="adicionarAAgenda"
                               name="adicionarAAgenda" value="true"
                               th:checked="${adicionarAAgenda == true}" />
                        Adicionar o próximo acompanhamento à agenda
                    </label>
                </div>

                <div id="camposProximoAgendamento" hidden>
                    <div class="relatorio-form-grade">
                        <div class="relatorio-form-campo">
                            <label for="horaInicio">Horário inicial *</label>
                            <input type="time" id="horaInicio"
                                   name="horaInicio" th:value="${horaInicio}" />
                        </div>

                        <div class="relatorio-form-campo">
                            <label for="horaFim">Horário final *</label>
                            <input type="time" id="horaFim"
                                   name="horaFim" th:value="${horaFim}" />
                        </div>

                        <div class="relatorio-form-campo">
                            <label for="cor">Cor na agenda *</label>
                            <input type="color" id="cor" name="cor"
                                   th:value="${cor != null ? cor : '#3498DB'}" />
                        </div>
                    </div>
                </div>
            </section>

            <div class="relatorio-form-acoes">
                <button type="submit" class="relatorios-btn-cadastrar">
                    Salvar relatório e concluir atendimento
                </button>
                <a th:href="@{/agendamentos/{id}(id=${agendamento.id})}"
                   class="relatorio-btn-voltar">
                    Voltar
                </a>
            </div>
        </form>
    </main>
</div>

    <script>
        const adicionarAAgenda = document.getElementById("adicionarAAgenda");
        const camposProximoAgendamento = document.getElementById("camposProximoAgendamento");
        const horaInicio = document.getElementById("horaInicio");
        const horaFim = document.getElementById("horaFim");

        function atualizarCamposProximoAgendamento() {
            const ativo = adicionarAAgenda.checked;
            camposProximoAgendamento.hidden = !ativo;
            horaInicio.required = ativo;
            horaFim.required = ativo;
        }

        adicionarAAgenda.addEventListener("change", atualizarCamposProximoAgendamento);
        atualizarCamposProximoAgendamento();
    </script>

</body>
</html>
